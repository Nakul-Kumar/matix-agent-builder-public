# Nginx reverse proxy for matixagents.com -> Node app on 127.0.0.1:5000
#
# Install:
#   sudo cp deploy/nginx-matixagents.conf /etc/nginx/sites-available/matixagents
#   sudo ln -s /etc/nginx/sites-available/matixagents /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then run certbot (see deploy/DEPLOY.md) to add the HTTPS (443) server block
# and the automatic HTTP->HTTPS redirect. Certbot edits this file in place.

server {
    listen 80;
    listen [::]:80;
    server_name matixagents.com www.matixagents.com;

    # Keep request bodies small; the app itself caps JSON at 32kb.
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

# OPTIONAL: redirect the bare domain to www (uncomment if you want www as the
# canonical host). Certbot will also need a cert covering matixagents.com.
